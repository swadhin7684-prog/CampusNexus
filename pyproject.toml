[project]
name = "campusnexus"
version = "1.0.0"
description = "ChronoSync - Autonomous AI Campus Scheduling & Resource Optimization Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "ortools>=9.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.8.0"
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.fastapi.static]
cdn = false
